name: Build and deploy Datubu
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site configuration
        uses: actions/checkout@v6
        with:
          path: site
      - name: Checkout shared website source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/journeys
          ref: ${{ vars.ENGINE_REF || 'main' }}
          path: engine
      - name: Checkout Markdown content
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/human-journeys
          ref: ${{ github.event.client_payload.content_sha || vars.CONTENT_REF || 'main' }}
          path: content
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install shared dependencies
        working-directory: engine
        run: npm ci --no-audit --no-fund
      - name: Record exact source versions
        shell: bash
        run: |
          printf 'CONTENT_REF=%s\n' "$(git -C content rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'ENGINE_REF=%s\n' "$(git -C engine rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate and build the site
        working-directory: engine
        run: node scripts/build.mjs
        env:
          SITE_CONFIG: ${{ github.workspace }}/site/site.config.json
          CONTENT_DIR: ${{ github.workspace }}/content
          OUTPUT_DIR: ${{ github.workspace }}/output
          GITHUB_OWNER: ${{ github.repository_owner }}
          NETWORK_MODE: ${{ vars.CUSTOM_DOMAINS_ACTIVE == 'true' && 'custom' || 'github' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
